# Publish Docker image
# Copy from new-api 
# https://github.com/QuantumNous/new-api/blob/main/.github/workflows/docker-image-arm64.yml
# The native-architecture build matrix is delegated to the shared reusable
# workflow docker-build.yml (mode: release).

name: Publish Docker image

on:
  push:
    tags:
      - 'v*'

jobs:
  build_single_arch:
    name: Build & push (release)
    uses: ./.github/workflows/docker-build.yml
    with:
      mode: release
      ref: ${{ github.sha }}
      tag: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write

  create_manifests:
    name: Create multi-arch manifests (GHCR)
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Extract tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # See the note in docker-build.yml: the fork installation cannot
          # access user-namespace GHCR packages with the built-in token.
          password: ${{ secrets.GHCR_PAT }}

      - name: Create & push manifest (Docker Hub - version)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/recho-design/axonhub:${TAG} \
            ghcr.io/recho-design/axonhub:${TAG}-amd64 \
            ghcr.io/recho-design/axonhub:${TAG}-arm64

      - name: Create & push manifest (Docker Hub - latest)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/recho-design/axonhub:latest \
            ghcr.io/recho-design/axonhub:latest-amd64 \
            ghcr.io/recho-design/axonhub:latest-arm64
