# Publish Docker image
# Copy from new-api 
# https://github.com/QuantumNous/new-api/blob/main/.github/workflows/docker-image-arm64.yml
# The native-architecture build matrix is delegated to the shared reusable
# workflow docker-build.yml (mode: release).

name: Publish Docker image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.0.0-rc.3
        required: true
        type: string
      branch:
        description: Branch or commit to build
        required: true
        type: string
        default: unstable

jobs:
  build_single_arch:
    name: Build & push (release)
    uses: ./.github/workflows/docker-build.yml
    with:
      mode: release
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  create_manifests:
    name: Create multi-arch manifests (GHCR)
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Extract tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG=$INPUT_TAG
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Release tag must look like v1.2.3, got: $TAG" >&2
              exit 1
              ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # See the note in docker-build.yml: the fork installation cannot
          # access user-namespace GHCR packages with the built-in token.
          password: ${{ secrets.GHCR_PAT }}

      - name: Create & push manifest (Docker Hub - version)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/recho-design/axonhub:${TAG} \
            ghcr.io/recho-design/axonhub:${TAG}-amd64

      - name: Create & push manifest (Docker Hub - latest)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/recho-design/axonhub:latest \
            ghcr.io/recho-design/axonhub:latest-amd64
